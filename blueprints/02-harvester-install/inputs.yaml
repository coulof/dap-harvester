input_groups:
  inventory_settings:
    display_label: Target Node Inventory
    collapsible: false
    index: 1
  network_settings:
    display_label: Network & VIP Configuration
    collapsible: true
    index: 2
  cluster_credentials:
    display_label: Cluster Security & Credentials
    collapsible: true
    index: 3

inputs:
  node_inventory:
    type: list
    display_label: Node Inventory
    description: List of target Harvester baremetal node objects from baremetal-prep phase.
    hidden: false
    allow_update: true
    display:
      group: inventory_settings

  harvester_version:
    type: string
    display_label: Harvester Version
    description: Harvester release version string to install.
    default: "v1.8.2"
    hidden: false
    allow_update: false
    display:
      group: inventory_settings

  cluster_vip:
    type: string
    display_label: Cluster Virtual IP (VIP)
    description: Virtual IP address for the Harvester management plane API and Web UI.
    hidden: false
    allow_update: false
    display:
      group: network_settings
    constraints:
      - pattern: '^((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)\.){3}(25[0-5]|(2[0-4]|1\d|[1-9]|)\d)$'
        error_message: Must be a valid IPv4 address.

  mgmt_vlan_id:
    type: integer
    display_label: Management VLAN ID
    description: Tagged VLAN ID for the Harvester management network.
    default: 176
    hidden: false
    allow_update: false
    display:
      group: network_settings

  gateway_ip:
    type: string
    display_label: Default Gateway IP
    description: Gateway IP address for the management subnet (corresponds to DHCP Option 3).
    hidden: false
    allow_update: false
    display:
      group: network_settings

  dns_servers:
    type: list
    display_label: DNS Nameservers
    description: List of upstream DNS server IP addresses.
    hidden: false
    allow_update: true
    display:
      group: network_settings

  fileserver_url:
    type: string
    display_label: Local Fileserver Base URL
    description: Base HTTP URL of the local Hauler fileserver serving boot files and configs.
    default: "http://10.100.0.10:8080"
    hidden: false
    allow_update: true
    display:
      group: network_settings

  cluster_token_secret_key:
    type: secret_key
    display_label: Cluster Token Secret Key
    description: Key name in DAP Secret Store holding the shared cluster token.
    hidden: false
    allow_update: false
    display:
      group: cluster_credentials
    constraints:
      - secret_type: password

  node_password_secret_key:
    type: secret_key
    display_label: Node Root Password Secret Key
    description: Key name in DAP Secret Store holding the initial node root password.
    hidden: false
    allow_update: false
    display:
      group: cluster_credentials
    constraints:
      - secret_type: password

  ssh_public_key:
    type: string
    display_label: SSH Public Key
    description: Authorized SSH public key injected into installed Harvester nodes.
    hidden: false
    allow_update: true
    display:
      group: cluster_credentials
