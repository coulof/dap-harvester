version: "3"

# Root Taskfile for DAP Harvester Stack
# Orchestrates blueprint validation (dap-bpa), airgap staging (hauler), and release archiving.

includes:
  airgap:
    taskfile: airgap/Taskfile.yml
    dir: airgap
  vmedia:
    taskfile: provisioning/vmedia/Taskfile.yml
    dir: provisioning/vmedia

vars:
  BLUEPRINTS_DIR: blueprints
  ARCHIVE_NAME: dap-harvester.tar.gz

tasks:
  check-deps:
    desc: "Check if dap-bpa CLI is installed"
    cmds:
      - |
        if command -v dap-bpa >/dev/null 2>&1; then
          dap-bpa --version
        else
          echo "[!] dap-bpa CLI is not installed."
          echo "    Please download dap-bpa from https://automation.dell.com/catalog/offers/blueprint_assist_macos"
          echo "    and place it in your PATH."
          exit 1
        fi

  lint:
    desc: "Lint all blueprints with dap-bpa"
    deps: [check-deps]
    cmds:
      - |
        for bp in {{.BLUEPRINTS_DIR}}/*/; do
          if [ -f "$bp/blueprint.yaml" ]; then
            echo "==> Linting $bp ..."
            dap-bpa blueprint lint --file "$bp/blueprint.yaml" --verify
          fi
        done

  validate:
    desc: "Schema validate all blueprint node templates"
    deps: [check-deps]
    cmds:
      - |
        for bp in {{.BLUEPRINTS_DIR}}/*/; do
          if [ -f "$bp/blueprint.yaml" ]; then
            echo "==> Validating $bp ..."
            dap-bpa blueprint validate-all --file "$bp/blueprint.yaml"
          fi
        done

  visualize:
    desc: "Generate offline HTML topology visualization with risk analysis"
    deps: [check-deps]
    cmds:
      - |
        for bp in {{.BLUEPRINTS_DIR}}/*/; do
          if [ -f "$bp/blueprint.yaml" ]; then
            echo "==> Visualizing $bp ..."
            dap-bpa blueprint visualize --file "$bp/blueprint.yaml"
          fi
        done

  archive:
    desc: "Create a clean tar.gz release archive of the repository using git archive"
    cmds:
      - git archive --format=tar.gz --prefix=dap-harvester/ -o {{.ARCHIVE_NAME}} HEAD
      - echo "[+] Created release archive {{.ARCHIVE_NAME}}"
