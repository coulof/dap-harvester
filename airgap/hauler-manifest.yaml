# Hauler Manifest for DAP Harvester Stack (Air-Gap)
# Serves Harvester v1.8.2 boot artifacts, Dell CSI PowerStore helm chart, and container images.

apiVersion: content.hauler.cattle.io/v1
kind: Files
metadata:
  name: harvester-v1-8-2-files
spec:
  files:
    - path: https://releases.rancher.com/harvester/v1.8.2/harvester-v1.8.2-amd64.iso
      name: harvester-v1.8.2-amd64.iso
    - path: https://releases.rancher.com/harvester/v1.8.2/harvester-v1.8.2-vmlinuz-amd64
      name: harvester-v1.8.2-vmlinuz-amd64
    - path: https://releases.rancher.com/harvester/v1.8.2/harvester-v1.8.2-initrd-amd64
      name: harvester-v1.8.2-initrd-amd64
    - path: https://releases.rancher.com/harvester/v1.8.2/harvester-v1.8.2-rootfs-amd64.squashfs
      name: harvester-v1.8.2-rootfs-amd64.squashfs
    - path: https://releases.rancher.com/harvester/v1.8.2/harvester-v1.8.2-amd64.sha512
      name: harvester-v1.8.2-amd64.sha512
    - path: https://releases.rancher.com/harvester/v1.8.2/version.yaml
      name: version.yaml
    - path: https://releases.rancher.com/harvester/v1.8.2/harvester-v1.8.2-amd64-net-install.iso
      name: harvester-v1.8.2-amd64-net-install.iso

---
apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: csi-powerstore-chart
  annotations:
    hauler.dev/registry: hauler-registry.local:5000
spec:
  charts:
    - name: csi-powerstore
      repoURL: https://dell.github.io/helm-charts
      version: 2.17.0

---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: csi-powerstore-images
  annotations:
    hauler.dev/registry: hauler-registry.local:5000
    hauler.dev/platform: linux/amd64
spec:
  images:
    - name: quay.io/dell/container-storage-modules/csi-powerstore:v2.17.0
    - name: registry.k8s.io/sig-storage/csi-attacher:v4.11.0
    - name: registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
    - name: registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
    - name: registry.k8s.io/sig-storage/csi-resizer:v2.1.0
    - name: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0
    - name: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.17.0
    - name: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.15.0
    - name: quay.io/dell/container-storage-modules/podmon:v1.16.0
    - name: quay.io/dell/container-storage-modules/csi-metadata-retriever:v1.14.0
    - name: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.5.0
